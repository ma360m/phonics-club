<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Mobile responsive layout sample</title>
  <desc id="desc">Sample showing how checkout and dashboard content will stack and wrap on mobile.</desc>
  <rect width="900" height="620" fill="#f4f8ff"/>
  <text x="450" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">Mobile layout after fix</text>
  <text x="450" y="84" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">Rows stack, text wraps, and floating buttons stay away from form fields.</text>

  <g transform="translate(90 120)">
    <rect width="310" height="430" rx="28" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
    <text x="28" y="52" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">Checkout</text>
    <rect x="26" y="78" width="258" height="154" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="46" y="112" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Fun Phonics Yellow readers</text>
    <text x="46" y="136" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">(pack of three)</text>
    <text x="46" y="162" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748b">Rs 850 each</text>
    <rect x="46" y="184" width="108" height="36" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="72" y="208" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">-</text>
    <text x="101" y="208" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">80</text>
    <text x="136" y="208" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">+</text>
    <text x="173" y="208" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8">Rs 68,000</text>
    <circle cx="264" cy="202" r="20" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="264" y="208" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#d30000">X</text>

    <text x="28" y="274" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Full Name *</text>
    <rect x="26" y="288" width="258" height="42" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="28" y="360" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Phone (Pakistan) *</text>
    <rect x="26" y="374" width="258" height="42" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <circle cx="246" cy="372" r="22" fill="#25d366"/>
    <circle cx="204" cy="424" r="22" fill="#d30000"/>
    <circle cx="260" cy="424" r="22" fill="#1d4ed8"/>
    <text x="155" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748b">No horizontal page cutting</text>
  </g>

  <g transform="translate(500 120)">
    <rect width="310" height="430" rx="28" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
    <text x="28" y="52" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">Dashboard</text>
    <rect x="26" y="80" width="258" height="70" rx="20" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="50" y="122" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">My Courses</text>
    <rect x="214" y="101" width="48" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="238" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Open</text>

    <rect x="42" y="168" width="226" height="86" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="60" y="201" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Teaching of English</text>
    <text x="60" y="224" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a">through Jolly Phonics</text>
    <rect x="60" y="236" width="160" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="60" y="236" width="108" height="8" rx="4" fill="#d30000"/>

    <rect x="26" y="282" width="258" height="70" rx="20" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="50" y="324" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Recent Orders</text>
    <rect x="214" y="303" width="48" height="28" rx="14" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="238" y="322" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b">Close</text>

    <rect x="26" y="374" width="258" height="42" rx="21" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="155" y="400" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Inactive tabs stay neutral</text>
    <text x="155" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748b">Cards expand only when needed</text>
  </g>
</svg>
